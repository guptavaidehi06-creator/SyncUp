<div class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">

  <div class="card shadow-lg border-0" style="max-width: 420px; width: 90%; border-radius: 16px;">
    <div class="card-body p-4">

      <div class="text-center mb-4">
        <h2 class="fw-bold text-primary mb-1">📅 SyncUp</h2>
        <p class="text-muted mb-0">Log in to your dashboard</p>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

      <form #loginForm="ngForm" (ngSubmit)="login()">

        <div class="mb-3">
          <label class="form-label fw-semibold">Email</label>
          <input type="email" class="form-control form-control-lg" name="email"
            [(ngModel)]="credentials.email" required placeholder="you@example.com">
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" class="form-control form-control-lg" name="password"
            [(ngModel)]="credentials.password" required placeholder="Your password">
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold" [disabled]="loginForm.invalid">
          Log In
        </button>
      </form>

      <p class="text-center text-muted mt-3 mb-0">
        Don't have an account? <a routerLink="/sign-up">Sign up</a>
      </p>

    </div>
  </div>

</div>
