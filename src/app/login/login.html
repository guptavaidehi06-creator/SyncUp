<main class="auth-page">

  <div class="auth-card">

```
<!-- BRAND -->

<div class="auth-brand">

  <div class="brand-mark">
    S
  </div>

  <h1>
    SyncUp
  </h1>

  <p>
    Welcome back. Plan your next meeting.
  </p>

</div>


<!-- ERROR MESSAGE -->

<div
  *ngIf="errorMessage"
  class="error-message">

  {{ errorMessage }}

</div>


<!-- LOGIN FORM -->

<form
  #loginForm="ngForm"
  (ngSubmit)="login()">


  <!-- EMAIL -->

  <div class="form-group">

    <label for="email">
      Email address
    </label>

    <input
      id="email"
      type="email"
      name="email"
      [(ngModel)]="credentials.email"
      required
      placeholder="you@example.com">

  </div>


  <!-- PASSWORD -->

  <div class="form-group">

    <label for="password">
      Password
    </label>

    <input
      id="password"
      type="password"
      name="password"
      [(ngModel)]="credentials.password"
      required
      placeholder="Enter your password">

  </div>


  <!-- LOGIN BUTTON -->

  <button
    type="submit"
    class="primary-button"
    [disabled]="loginForm.invalid">

    Log in

  </button>

</form>


<!-- FORGOT PASSWORD -->

<div class="forgot-password">

  <a routerLink="/forgot-password">
    Forgot password?
  </a>

</div>


<!-- SIGN UP -->

<div class="signup-link">

  <span>
    Don't have an account?
  </span>

  <a routerLink="/sign-up">
    Sign up
  </a>

</div>


  </div>

</main>
