<main class="auth-page">
  <div class="auth-card">
    <div class="card-body p-4">

      <div class="auth-brand">
        <span class="brand-mark">S</span>
        <h1>SyncUp</h1>
        <p class="text-muted mb-0">Reset your password</p>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger py-2 small">{{ errorMessage }}</div>
      <div *ngIf="successMessage && step === 'reset'" class="alert alert-success py-2 small">{{ successMessage }}</div>

      <div *ngIf="step === 'request'">
        <form #requestForm="ngForm" (ngSubmit)="requestCode()">
          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" class="form-control form-control-lg" name="email"
              [(ngModel)]="email" required placeholder="you@gmail.com">
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold" [disabled]="requestForm.invalid || isRequesting">
            {{ isRequesting ? 'Sending...' : 'Send Reset Code' }}
          </button>
        </form>
      </div>

      <div *ngIf="step === 'reset'">
        <form #resetForm="ngForm" (ngSubmit)="resetPassword()">
          <div class="mb-3">
            <label class="form-label fw-semibold">Reset Code</label>
            <input type="text" class="form-control form-control-lg text-center" name="code"
              [(ngModel)]="code" required minlength="6" maxlength="6"
              placeholder="123456" style="letter-spacing: 4px; font-size: 20px;">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">New Password</label>
            <input type="password" class="form-control form-control-lg" name="newPassword"
              [(ngModel)]="newPassword" required minlength="8"
              pattern="^(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&amp;*()_+\-=\[\]{};':&quot;\\|,.&lt;&gt;\/?]).+$"
              placeholder="Must contain a special character">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Confirm New Password</label>
            <input type="password" class="form-control form-control-lg" name="confirmPassword"
              [(ngModel)]="confirmPassword" required placeholder="Re-enter your new password">
            <div *ngIf="confirmPassword && newPassword !== confirmPassword" class="text-danger small mt-1">
              Passwords do not match.
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold" [disabled]="resetForm.invalid || isResetting">
            {{ isResetting ? 'Resetting...' : 'Reset Password' }}
          </button>
        </form>
      </div>

      <p class="text-center text-muted mt-3 mb-0">
        <a routerLink="/login">Back to login</a>
      </p>

    </div>
  </div>
</main>
