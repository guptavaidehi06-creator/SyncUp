<main class="auth-page">

  <div class="auth-card">

    <div class="card-body p-4">

      <!-- BRAND -->
      <div class="auth-brand">

        <span class="brand-mark">S</span>

        <h1>SyncUp</h1>

        <p>
          <span *ngIf="step === 'request'">
            Reset your password
          </span>

          <span *ngIf="step === 'reset'">
            Create a new secure password
          </span>
        </p>

      </div>


      <!-- ERROR MESSAGE -->
      <div
        *ngIf="errorMessage"
        class="alert alert-danger py-2 small">

        {{ errorMessage }}

      </div>


      <!-- SUCCESS MESSAGE -->
      <div
        *ngIf="successMessage"
        class="alert alert-success py-2 small">

        {{ successMessage }}

      </div>


      <!-- ================= STEP 1 : EMAIL ================= -->

      <div *ngIf="step === 'request'">

        <form
          #requestForm="ngForm"
          (ngSubmit)="requestCode()">

          <div class="mb-3">

            <label class="form-label fw-semibold">
              Email
            </label>

            <input
              type="email"
              class="form-control form-control-lg"
              name="email"
              [(ngModel)]="email"
              required
              placeholder="you@gmail.com">

          </div>


          <button
            type="submit"
            class="btn btn-primary btn-lg w-100 fw-semibold"
            [disabled]="requestForm.invalid || isRequesting">

            {{ isRequesting ? 'Sending...' : 'Send Reset Code' }}

          </button>

        </form>

      </div>


      <!-- ================= STEP 2 : RESET PASSWORD ================= -->

      <div *ngIf="step === 'reset'">

        <form
          #resetForm="ngForm"
          (ngSubmit)="resetPassword()">


          <!-- RESET CODE -->

          <div class="mb-3">

            <label class="form-label fw-semibold">
              Reset Code
            </label>

            <input
              type="text"
              class="form-control form-control-lg text-center"
              name="code"
              [(ngModel)]="code"
              required
              minlength="6"
              maxlength="6"
              placeholder="123456"
              style="letter-spacing: 4px; font-size: 20px;">

          </div>


          <!-- NEW PASSWORD -->

          <div class="mb-3">

            <label class="form-label fw-semibold">
              New Password
            </label>

            <input
              type="password"
              class="form-control form-control-lg"
              name="newPassword"
              [(ngModel)]="newPassword"
              required
              minlength="8"
              placeholder="Create a new password">

            <small class="password-hint">
              Minimum 8 characters.
            </small>

          </div>


          <!-- CONFIRM PASSWORD -->

          <div class="mb-4">

            <label class="form-label fw-semibold">
              Confirm New Password
            </label>

            <input
              type="password"
              class="form-control form-control-lg"
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              required
              placeholder="Re-enter your new password">


            <div
              *ngIf="
                confirmPassword &&
                newPassword !== confirmPassword
              "
              class="text-danger small mt-1">

              Passwords do not match.

            </div>

          </div>


          <!-- RESET BUTTON -->

          <button
            type="submit"
            class="btn btn-primary btn-lg w-100 fw-semibold"
            [disabled]="
              resetForm.invalid ||
              isResetting ||
              newPassword !== confirmPassword
            ">

            {{ isResetting ? 'Resetting...' : 'Reset Password' }}

          </button>

        </form>

      </div>


      <!-- BACK TO LOGIN -->

      <p class="back-login text-center mt-4 mb-0">

        <a routerLink="/login">
          ← Back to login
        </a>

      </p>

    </div>

  </div>

</main>
