<main class="avail-page">

  <section class="avail-card" *ngIf="meeting">

    <div class="avail-intro">
      <span class="eyebrow">AVAILABILITY</span>
      <h1>{{ meeting.title }}</h1>
      <p *ngIf="!submitted">
        Hi {{ currentUser?.name }}, let us know when you are free.
      </p>
      <span class="meeting-chip">
        {{ meeting.meetingDate | date }}
      </span>
    </div>

    <form
      *ngIf="!submitted"
      class="form"
      #availForm="ngForm"
      (ngSubmit)="submitAvailability()">

      <label>
        Your available time windows
      </label>

      <div
        *ngFor="let window of timeWindows; let i = index"
        class="time-window">

        <label>
          Start time
          <input
            type="time"
            name="startTime{{i}}"
            [(ngModel)]="window.startTime"
            (ngModelChange)="onStartTimeChange(window)"
            step="60"
            required>
        </label>

        <label>
          End time
          <input
            type="time"
            name="endTime{{i}}"
            [(ngModel)]="window.endTime"
            [min]="getMinimumEndTime(window.startTime)"
            step="60"
            required>
        </label>

        <button
          type="button"
          class="quiet danger"
          *ngIf="timeWindows.length > 1"
          (click)="removeWindow(i)">
          Remove
        </button>

      </div>

      <p class="time-validation" *ngIf="timeValidationMessage">
        {{ timeValidationMessage }}
      </p>

      <button
        type="button"
        class="quiet"
        (click)="addAnotherWindow()">
        + Add another time window
      </button>

      <button
        type="submit"
        class="primary"
        [disabled]="availForm.invalid || !hasValidTimeWindows() || submitting">
        {{ submitting ? 'Submitting...' : 'Submit Availability' }}
      </button>

    </form>

    <div *ngIf="submitted" class="success-state">
      <div class="slot-icon">✓</div>
      <h2>Thank you</h2>
      <p>Your availability has been submitted successfully.</p>
    </div>

  </section>

  <section class="avail-empty" *ngIf="!meeting">
    <h2>Loading meeting details</h2>
    <p>Please wait while SyncUp loads this meeting.</p>
  </section>

</main>
